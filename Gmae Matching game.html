<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมจับคู่ภาพ (Memory Card Game)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f3f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      color: #333;
      margin-bottom: 15px;
    }

    .setup-container {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .setup-container input {
      padding: 8px 12px;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    .setup-container input:focus {
      border-color: #3498db;
    }

    .info-container {
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #555;
      font-weight: bold;
    }

    .main-layout {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 12px;
      perspective: 1000px;
    }

    .card {
      width: 80px;
      height: 80px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }

    .card.flip {
      transform: rotateY(180deg);
    }

    .front, .back {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      user-select: none;
    }

    .front {
      background-color: #3498db;
      color: white;
      font-size: 2rem;
    }

    .back {
      background-color: #ffffff;
      font-size: 2.5rem;
      transform: rotateY(180deg);
    }

    .leaderboard {
      background: white;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      min-width: 250px;
    }

    .leaderboard h2 {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .leaderboard ol {
      padding-left: 20px;
      font-size: 0.95rem;
      color: #444;
    }

    .leaderboard li {
      margin-bottom: 6px;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
      color: white;
      font-weight: bold;
    }

    .btn-restart {
      background-color: #2ecc71;
    }
    .btn-restart:hover {
      background-color: #27ae60;
    }

    .btn-clear {
      background-color: #e74c3c;
    }
    .btn-clear:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <h1>เกมจับคู่ภาพ 🧩</h1>

  <div class="setup-container">
    <label for="playerName">ชื่อเล่น:</label>
    <input type="text" id="playerName" placeholder="ใส่ชื่อเล่นของคุณ" maxlength="12">
  </div>

  <div class="info-container">
    <div>⏱️ เวลา: <span id="timer">00:00</span></div>
    <div>🎯 เปิดไป: <span id="moves">0</span> ครั้ง</div>
  </div>

  <div class="main-layout">
    <div class="grid-container" id="grid"></div>

    <div class="leaderboard">
      <h2>🏆 อันดับเวลาที่ดีที่สุด</h2>
      <ol id="highScoresList">
        <li>ยังไม่มีสถิติ</li>
      </ol>
    </div>
  </div>

  <div class="controls">
    <button class="btn-restart" onclick="restartGame()">เริ่มเกมใหม่</button>
    <button class="btn-clear" onclick="clearLeaderboard()">ล้างสถิติ</button>
  </div>

  <script>
    const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
    let cardsData = [...emojis, ...emojis];
    
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let moves = 0;
    let matchedPairs = 0;

    let secondsElapsed = 0;
    let timerInterval = null;
    let isTimerRunning = false;

    const grid = document.getElementById('grid');
    const movesDisplay = document.getElementById('moves');
    const timerDisplay = document.getElementById('timer');
    const playerNameInput = document.getElementById('playerName');
    const highScoresList = document.getElementById('highScoresList');

    // โหลดสถิติจาก LocalStorage เมื่อเปิดหน้าเว็บ
    window.onload = () => {
      displayHighScores();
    };

    function startTimer() {
      if (!isTimerRunning) {
        isTimerRunning = true;
        timerInterval = setInterval(() => {
          secondsElapsed++;
          timerDisplay.textContent = formatTime(secondsElapsed);
        }, 1000);
      }
    }

    function stopTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function createBoard() {
      grid.innerHTML = '';
      shuffle(cardsData);

      cardsData.forEach(emoji => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.emoji = emoji;

        card.innerHTML = `
          <div class="front">❓</div>
          <div class="back">${emoji}</div>
        `;

        card.addEventListener('click', flipCard);
        grid.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;

      startTimer();

      this.classList.add('flip');

      if (!hasFlippedCard) {
        hasFlippedCard = true;
        firstCard = this;
        return;
      }

      secondCard = this;
      moves++;
      movesDisplay.textContent = moves;

      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
      isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);

      matchedPairs++;
      resetBoard();

      if (matchedPairs === emojis.length) {
        stopTimer();
        const playerName = playerNameInput.value.trim() || 'ผู้เล่นนิรนาม';
        saveHighScore(playerName, secondsElapsed, moves);

        setTimeout(() => {
          alert(`🎉 ยินดีด้วยคุณ ${playerName}!\n⏱️ เวลาที่ใช้: ${formatTime(secondsElapsed)}\n🎯 เปิดทั้งหมด: ${moves} ครั้ง`);
          displayHighScores();
        }, 500);
      }
    }

    function unflipCards() {
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flip');
        secondCard.classList.remove('flip');
        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [hasFlippedCard, lockBoard] = [false, false];
      [firstCard, secondCard] = [null, null];
    }

    function restartGame() {
      stopTimer();
      secondsElapsed = 0;
      timerDisplay.textContent = '00:00';
      moves = 0;
      matchedPairs = 0;
      movesDisplay.textContent = moves;
      resetBoard();
      createBoard();
    }

    // --- บันทึกและแสดงตารางคะแนน ---
    function saveHighScore(name, time, movesCount) {
      const highScores = JSON.parse(localStorage.getItem('memoryGameScores')) || [];
      
      const newScore = {
        name: name,
        time: time,
        moves: movesCount
      };

      highScores.push(newScore);
      // เรียงจากเวลาน้อยไปมาก (ถ้าเวลาเท่ากัน เรียงตามจำนวนครั้งที่เปิดน้อยไปมาก)
      highScores.sort((a, b) => a.time - b.time || a.moves - b.moves);
      
      // เก็บแค่ Top 5
      const topScores = highScores.slice(0, 5);
      localStorage.setItem('memoryGameScores', JSON.stringify(topScores));
    }

    function displayHighScores() {
      const highScores = JSON.parse(localStorage.getItem('memoryGameScores')) || [];
      highScoresList.innerHTML = '';

      if (highScores.length === 0) {
        highScoresList.innerHTML = '<li>ยังไม่มีสถิติ</li>';
        return;
      }

      highScores.forEach(score => {
        const li = document.createElement('li');
        li.textContent = `${score.name} - ${formatTime(score.time)} (${score.moves} ครั้ง)`;
        highScoresList.appendChild(li);
      });
    }

    function clearLeaderboard() {
      if (confirm('คุณต้องการลบสถิติทั้งหมดใช่หรือไม่?')) {
        localStorage.removeItem('memoryGameScores');
        displayHighScores();
      }
    }

    createBoard();
  </script>
</body>
</html>
