<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เกมจับคู่สัตว์ในป่า - Jungle Memory Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      /* พื้นหลังรูปป่าธรรมชาติ */
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                  url('https://images.unsplash.com/photo-1511497584788-8767611136f6?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 15px;
      color: #72f238;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8), 0 0 12px rgba(114, 242, 56, 0.6);
    }

    /* Modal หน้าลงชื่อ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .modal-content {
      background: rgba(20, 45, 20, 0.95);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(114, 242, 56, 0.3);
      text-align: center;
      max-width: 350px;
      width: 90%;
    }

    .modal-content h2 {
      margin-bottom: 15px;
      color: #72f238;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #2d5a27;
      border-radius: 8px;
      background: #122410;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .modal-content input:focus {
      border-color: #72f238;
    }

    .dashboard {
      display: flex;
      gap: 15px;
      background: rgba(15, 35, 15, 0.75);
      padding: 15px 20px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .stat-box {
      text-align: center;
      min-width: 90px;
    }

    .stat-box span {
      display: block;
      font-size: 0.8rem;
      color: #ddd;
    }

    .stat-box div {
      font-size: 1.1rem;
      font-weight: bold;
      color: #72f238;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      background: #72f238;
      color: #0d2008;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    button:hover {
      background: #5cc22b;
      transform: translateY(-2px);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 85px);
      grid-gap: 12px;
      perspective: 1000px;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 16px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .card {
      width: 85px;
      height: 85px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
    }

    .card.matched {
      cursor: default;
      opacity: 0.5;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      backface-visibility: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    .card-front {
      background: linear-gradient(135deg, #1e4620, #0d2008);
      border: 2px solid #3c8234;
      color: #72f238;
    }

    .card-front::after {
      content: "🌿";
      font-size: 1.6rem;
    }

    .card-back {
      background: #ffffff;
      border: 2px solid #72f238;
      transform: rotateY(180deg);
    }

    @media (max-width: 420px) {
      .game-board {
        grid-template-columns: repeat(4, 68px);
        grid-gap: 8px;
        padding: 10px;
      }
      .card {
        width: 68px;
        height: 68px;
      }
      .card-face {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- Modal ลงชื่อ -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-content">
      <h2>🌲 ยินดีต้อนรับสู่พงไพร 🦁</h2>
      <p style="margin-bottom: 15px; color: #ccc;">กรุณากรอกชื่อของคุณเพื่อเริ่มการสำรวจ</p>
      <input type="text" id="player-name-input" placeholder="พิมพ์ชื่อผู้เล่น..." maxlength="12" />
      <button onclick="startGameWithPlayer()">เริ่มสำรวจป่า</button>
    </div>
  </div>

  <h1>เกมจับคู่สัตว์ในป่า</h1>

  <div class="dashboard">
    <div class="stat-box">
      <span>ผู้เล่น</span>
      <div id="player-display">-</div>
    </div>
    <div class="stat-box">
      <span>เวลาปัจจุบัน</span>
      <div id="timer">00:00</div>
    </div>
    <div class="stat-box">
      <span>จำนวนครั้ง</span>
      <div id="moves">0</div>
    </div>
    <div class="stat-box">
      <span>สถิติดีที่สุด</span>
      <div id="best-score">--:-- (--)</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="resetGame()">เริ่มเกมใหม่</button>
    <button class="secondary" onclick="changePlayer()">เปลี่ยนชื่อผู้เล่น</button>
  </div>

  <div class="game-board" id="game-board"></div>

  <script>
    // สัตว์ป่า 8 ชนิด
    const animals = ['🦁', '🐯', '🐘', '🐒', '🦒', 'จ', '🦉', '🐍'];
    // เปลี่ยนสัญลักษณ์ให้เป็นรูปสัตว์เต็มตัว
    const jungleAnimals = ['🦁', '🐯', '🐘', '🐒', '🦒', 'บ', '🦉', '🐍'];
    const cardsList = ['🦁', '🐯', '🐘', '🐒', '🦒', 'กบาล', '🦉', '🐍'];
    const animalIcons = ['🦁', '🐯', '🐘', '🐒', '🦒', '🐊', '🦉', '🐍'];
    
    let cards = [...animalIcons, ...animalIcons];
    
    let currentPlayer = '';
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timer = null;
    let secondsElapsed = 0;
    let gameStarted = false;
    let lockBoard = false;

    const boardElement = document.getElementById('game-board');
    const timerElement = document.getElementById('timer');
    const movesElement = document.getElementById('moves');
    const bestScoreElement = document.getElementById('best-score');
    const playerDisplayElement = document.getElementById('player-display');
    const loginModal = document.getElementById('login-modal');
    const playerNameInput = document.getElementById('player-name-input');

    window.onload = () => {
      const savedPlayer = localStorage.getItem('jungle_memory_player');
      if (savedPlayer) {
        currentPlayer = savedPlayer;
        playerDisplayElement.textContent = currentPlayer;
        loginModal.style.display = 'none';
        resetGame();
      }
    };

    function startGameWithPlayer() {
      const name = playerNameInput.value.trim();
      if (!name) {
        alert('กรุณากรอกชื่อก่อนเล่นครับ');
        return;
      }
      currentPlayer = name;
      localStorage.setItem('jungle_memory_player', currentPlayer);
      playerDisplayElement.textContent = currentPlayer;
      loginModal.style.display = 'none';
      resetGame();
    }

    function changePlayer() {
      stopTimer();
      playerNameInput.value = '';
      loginModal.style.display = 'flex';
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startTimer() {
      if (gameStarted) return;
      gameStarted = true;
      timer = setInterval(() => {
        secondsElapsed++;
        timerElement.textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      gameStarted = false;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function createBoard() {
      boardElement.innerHTML = '';
      const shuffledCards = shuffle([...cards]);

      shuffledCards.forEach((animal) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.animal = animal;

        const frontFace = document.createElement('div');
        frontFace.classList.add('card-face', 'card-front');

        const backFace = document.createElement('div');
        backFace.classList.add('card-face', 'card-back');
        backFace.textContent = animal;

        card.appendChild(frontFace);
        card.appendChild(backFace);
        card.addEventListener('click', flipCard);

        boardElement.appendChild(card);
      });

      loadStats();
    }

    function flipCard() {
      if (lockBoard || this.classList.contains('flipped') || this.classList.contains('matched')) return;

      startTimer();

      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        moves++;
        movesElement.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.animal === card2.dataset.animal;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        flippedCards = [];

        if (matchedPairs === animalIcons.length) {
          stopTimer();
          setTimeout(() => {
            alert(`🎉 ยินดีด้วยคุณ ${currentPlayer}!\nคุณพบสัตว์ป่าทั้งหมดแล้ว\n⏱️ เวลาที่ใช้: ${formatTime(secondsElapsed)}\n🔄 จำนวนครั้ง: ${moves} ครั้ง`);
            saveStats();
          }, 300);
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 800);
      }
    }

    function saveStats() {
      const timeKey = `jungle_best_time_${currentPlayer}`;
      const movesKey = `jungle_best_moves_${currentPlayer}`;

      const bestTime = localStorage.getItem(timeKey);
      const bestMoves = localStorage.getItem(movesKey);

      if (!bestTime || secondsElapsed < parseInt(bestTime)) {
        localStorage.setItem(timeKey, secondsElapsed);
      }

      if (!bestMoves || moves < parseInt(bestMoves)) {
        localStorage.setItem(movesKey, moves);
      }

      loadStats();
    }

    function loadStats() {
      if (!currentPlayer) return;

      const bestTime = localStorage.getItem(`jungle_best_time_${currentPlayer}`);
      const bestMoves = localStorage.getItem(`jungle_best_moves_${currentPlayer}`);

      if (bestTime && bestMoves) {
        bestScoreElement.textContent = `${formatTime(parseInt(bestTime))} (${bestMoves}ครั้ง)`;
      } else {
        bestScoreElement.textContent = '--:-- (--)';
      }
    }

    function resetGame() {
      stopTimer();
      secondsElapsed = 0;
      moves = 0;
      matchedPairs = 0;
      flippedCards = [];
      lockBoard = false;

      timerElement.textContent = '00:00';
      movesElement.textContent = '0';

      createBoard();
    }
  </script>
</body>
</html>
